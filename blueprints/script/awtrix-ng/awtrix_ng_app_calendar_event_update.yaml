blueprint:
  name: AWTRIX NG App - Calendar Event - Update
  description: >-
    Publishes the selected calendar's next event as an AWTRIX NG pushed app.
    Configure it for one AWTRIX NG device, then run it manually with a calendar
    or call it from the matching automation blueprint.
  domain: script
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/script/awtrix-ng/awtrix_ng_app_calendar_event_update.yaml
  author: phillc
  input:
    awtrix_id:
      name: AWTRIX NG Device
      selector:
        device:
          filter:
            - model: AWTRIX NG
  
fields:
  calendar_id:
    name: Calendar Source
    selector:
      entity:
        filter:
          - domain: calendar
    required: true

variables:
  awtrix_id: !input awtrix_id
  awtrix_entities: "{{ device_entities(awtrix_id) }}"
  awtrix_topic: "{{ awtrix_entities | select('search', 'mqtt_prefix') | first }}"
  awtrix_topic_id: "{{ states(awtrix_topic) }}"
  text: "{{ state_attr(calendar_id, 'message') }}"
  start_time: "{{ state_attr(calendar_id, 'start_time') }}"
  prefix: >-
    {% if (start_time | as_datetime | as_local) < today_at("23:59") %}
      Today
    {% else %}
      {{ time_until(start_time | as_datetime) }}
    {% endif %}

sequence:
  - action: mqtt.publish
    data:
      topic: "{{ awtrix_topic_id }}/cmd/apps/pushed/calendar_event"
      payload: >-
        {% set output = {"text": prefix ~ ": " ~ text, "icon": "230", "iconMode": "push"} %}
        {{ output | to_json(sort_keys=True) }}
