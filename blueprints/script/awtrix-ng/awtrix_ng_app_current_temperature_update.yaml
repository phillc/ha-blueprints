blueprint:
  name: AWTRIX NG App - Current Temperature - Update
  description: >-
    Publishes one to five selected temperature sensors as an AWTRIX NG pushed
    app. Each sensor can be independently rounded to 0, 1, or 2 decimal places
    and formatted with a degree symbol, the sensor’s unit, and text color.
  domain: script
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/script/awtrix-ng/awtrix_ng_app_current_temperature_update.yaml
  author: phillc
  input:
    awtrix_id:
      name: AWTRIX NG Device
      selector:
        device:
          filter:
            - model: AWTRIX NG
    app_name:
      name: App Name
      description: "The pushed app name used in the AWTRIX NG app rotation."
      default: current_temperature
      selector:
        text:
          type: text
    app_icon:
      name: App Icon
      description: "Optional AWTRIX icon ID for the app."
      default: "3357"
      selector:
        text:
          type: text
    temperature_1_sensor_id:
      name: Sensor 1 - Temperature Sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    temperature_1_round:
      name: Sensor 1 - Rounding
      description: "Keep the original reading or round to the selected number of decimal places."
      default: "No rounding"
      selector:
        select:
          mode: dropdown
          options:
            - "No rounding"
            - "0"
            - "1"
            - "2"
    temperature_1_degree:
      name: Sensor 1 - Degree Symbol
      default: true
      selector:
        boolean:
    temperature_1_show_unit:
      name: Sensor 1 - Show Unit
      description: "Show the sensor's unit (such as C or F). The degree symbol is controlled separately."
      default: true
      selector:
        boolean:
    temperature_1_color:
      name: Sensor 1 - Text Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}
    temperature_2_sensor_id:
      name: Sensor 2 - Temperature Sensor
      description: "Optional. Leave empty to skip this slot."
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    temperature_2_round:
      name: Sensor 2 - Rounding
      description: "Keep the original reading or round to the selected number of decimal places."
      default: "No rounding"
      selector:
        select:
          mode: dropdown
          options:
            - "No rounding"
            - "0"
            - "1"
            - "2"
    temperature_2_degree:
      name: Sensor 2 - Degree Symbol
      default: true
      selector:
        boolean:
    temperature_2_show_unit:
      name: Sensor 2 - Show Unit
      description: "Show the sensor's unit (such as C or F). The degree symbol is controlled separately."
      default: true
      selector:
        boolean:
    temperature_2_color:
      name: Sensor 2 - Text Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}
    temperature_3_sensor_id:
      name: Sensor 3 - Temperature Sensor
      description: "Optional. Leave empty to skip this slot."
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    temperature_3_round:
      name: Sensor 3 - Rounding
      description: "Keep the original reading or round to the selected number of decimal places."
      default: "No rounding"
      selector:
        select:
          mode: dropdown
          options:
            - "No rounding"
            - "0"
            - "1"
            - "2"
    temperature_3_degree:
      name: Sensor 3 - Degree Symbol
      default: true
      selector:
        boolean:
    temperature_3_show_unit:
      name: Sensor 3 - Show Unit
      description: "Show the sensor's unit (such as C or F). The degree symbol is controlled separately."
      default: true
      selector:
        boolean:
    temperature_3_color:
      name: Sensor 3 - Text Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}
    temperature_4_sensor_id:
      name: Sensor 4 - Temperature Sensor
      description: "Optional. Leave empty to skip this slot."
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    temperature_4_round:
      name: Sensor 4 - Rounding
      description: "Keep the original reading or round to the selected number of decimal places."
      default: "No rounding"
      selector:
        select:
          mode: dropdown
          options:
            - "No rounding"
            - "0"
            - "1"
            - "2"
    temperature_4_degree:
      name: Sensor 4 - Degree Symbol
      default: true
      selector:
        boolean:
    temperature_4_show_unit:
      name: Sensor 4 - Show Unit
      description: "Show the sensor's unit (such as C or F). The degree symbol is controlled separately."
      default: true
      selector:
        boolean:
    temperature_4_color:
      name: Sensor 4 - Text Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}
    temperature_5_sensor_id:
      name: Sensor 5 - Temperature Sensor
      description: "Optional. Leave empty to skip this slot."
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    temperature_5_round:
      name: Sensor 5 - Rounding
      description: "Keep the original reading or round to the selected number of decimal places."
      default: "No rounding"
      selector:
        select:
          mode: dropdown
          options:
            - "No rounding"
            - "0"
            - "1"
            - "2"
    temperature_5_degree:
      name: Sensor 5 - Degree Symbol
      default: true
      selector:
        boolean:
    temperature_5_show_unit:
      name: Sensor 5 - Show Unit
      description: "Show the sensor's unit (such as C or F). The degree symbol is controlled separately."
      default: true
      selector:
        boolean:
    temperature_5_color:
      name: Sensor 5 - Text Color
      default: [255, 255, 255]
      selector:
        color_rgb: {}

variables:
  awtrix_id: !input awtrix_id
  app_name: !input app_name
  app_icon: !input app_icon
  temperature_1_sensor_id: !input temperature_1_sensor_id
  temperature_1_round: !input temperature_1_round
  temperature_1_degree: !input temperature_1_degree
  temperature_1_show_unit: !input temperature_1_show_unit
  temperature_1_color: !input temperature_1_color
  temperature_2_sensor_id: !input temperature_2_sensor_id
  temperature_2_round: !input temperature_2_round
  temperature_2_degree: !input temperature_2_degree
  temperature_2_show_unit: !input temperature_2_show_unit
  temperature_2_color: !input temperature_2_color
  temperature_3_sensor_id: !input temperature_3_sensor_id
  temperature_3_round: !input temperature_3_round
  temperature_3_degree: !input temperature_3_degree
  temperature_3_show_unit: !input temperature_3_show_unit
  temperature_3_color: !input temperature_3_color
  temperature_4_sensor_id: !input temperature_4_sensor_id
  temperature_4_round: !input temperature_4_round
  temperature_4_degree: !input temperature_4_degree
  temperature_4_show_unit: !input temperature_4_show_unit
  temperature_4_color: !input temperature_4_color
  temperature_5_sensor_id: !input temperature_5_sensor_id
  temperature_5_round: !input temperature_5_round
  temperature_5_degree: !input temperature_5_degree
  temperature_5_show_unit: !input temperature_5_show_unit
  temperature_5_color: !input temperature_5_color
  awtrix_entities: "{{ device_entities(awtrix_id) }}"
  awtrix_topic: "{{ awtrix_entities | select('search', 'mqtt_prefix') | first }}"
  awtrix_topic_id: "{{ states(awtrix_topic) }}"

sequence:
  - action: mqtt.publish
    data:
      topic: "{{ awtrix_topic_id }}/cmd/apps/pushed/{{ app_name }}"
      payload: >-
        {% set sensor_ids = [temperature_1_sensor_id, temperature_2_sensor_id, temperature_3_sensor_id, temperature_4_sensor_id, temperature_5_sensor_id] %}
        {% set rounding_options = [temperature_1_round, temperature_2_round, temperature_3_round, temperature_4_round, temperature_5_round] %}
        {% set degree_flags = [temperature_1_degree, temperature_2_degree, temperature_3_degree, temperature_4_degree, temperature_5_degree] %}
        {% set show_unit_flags = [temperature_1_show_unit, temperature_2_show_unit, temperature_3_show_unit, temperature_4_show_unit, temperature_5_show_unit] %}
        {% set colors = [temperature_1_color, temperature_2_color, temperature_3_color, temperature_4_color, temperature_5_color] %}
        {% set ns = namespace(fragments=[]) %}
        {% for sensor_id in sensor_ids %}
          {% set value = states(sensor_id) if sensor_id else "unknown" %}
          {% if value not in ['unknown', 'unavailable', 'none'] %}
            {% set rounding = rounding_options[loop.index0] %}
            {% if rounding is sameas true or rounding | string in ['0', '1', '2'] %}
              {% set precision = 0 if rounding is sameas true else rounding | int %}
              {% set value = ("%." ~ precision ~ "f") | format(value | float | round(precision)) %}
            {% endif %}
            {% set unit = (state_attr(sensor_id, 'unit_of_measurement') or '') | replace('°', '') if show_unit_flags[loop.index0] else '' %}
            {% set value = value ~ ("°" if degree_flags[loop.index0] else "") ~ unit %}
            {% set fragment = {"text": value, "color": colors[loop.index0]} %}
            {% if ns.fragments %}
              {% set ns.fragments = ns.fragments + [{"text": " "}] %}
            {% endif %}
            {% set ns.fragments = ns.fragments + [fragment] %}
          {% endif %}
        {% endfor %}
        {% if app_icon %}
          {% set output = {"text": ns.fragments, "icon": app_icon, "iconMode": "push"} %}
        {% else %}
          {% set output = {"text": ns.fragments} %}
        {% endif %}
        {{ output | to_json(sort_keys=True) }}
