blueprint:
  name: AWTRIX NG App - Current Temperature - Update
  description: >-
    Publishes a configurable list of temperature sensors as an AWTRIX NG pushed
    app. Each sensor can be independently rounded to 0, 1, or 2 decimal places
    and formatted with an optional label, a degree symbol, the sensor’s unit,
    and text color.
  domain: script
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/script/awtrix-ng/awtrix_ng_app_current_temperature_update.yaml
  author: phillc
  input:
    awtrix_id:
      name: AWTRIX NG Device
      selector:
        device:
          filter:
            - model: AWTRIX NG
    app_name:
      name: App Name
      description: "The pushed app name used in the AWTRIX NG app rotation."
      default: current_temperature
      selector:
        text:
          type: text
    app_icon:
      name: App Icon
      description: "Optional AWTRIX icon ID for the app."
      default: "3357"
      selector:
        text:
          type: text
    temperatures:
      name: Temperatures
      description: >-
        Add an entry for each temperature to display, in display order.
        Labels appear directly before readings (Inside becomes Inside72.1) and use
        the entry's text color. Leave the label empty for no label.
        Readings default to one decimal place with a degree symbol and unit.
        Enable the corresponding Hide switch to omit either. An omitted color uses white; select white
        explicitly if the color picker shows black.
      default: []
      selector:
        object:
          multiple: true
          label_field: sensor_id
          description_field: label
          fields:
            sensor_id:
              label: Temperature Sensor
              required: true
              selector:
                entity:
                  filter:
                    - domain: sensor
                      device_class: temperature
            label:
              label: Label
              selector:
                text:
                  type: text
            rounding:
              label: Rounding
              required: true
              selector:
                select:
                  mode: dropdown
                  options:
                    - "1"
                    - "No rounding"
                    - "0"
                    - "2"
            hide_degree:
              label: Hide Degree Symbol
              selector:
                boolean: {}
            hide_unit:
              label: Hide Unit (C or F)
              selector:
                boolean: {}
            color:
              label: Text Color
              selector:
                color_rgb: {}

variables:
  awtrix_id: !input awtrix_id
  app_name: !input app_name
  app_icon: !input app_icon
  temperatures: !input temperatures
  awtrix_entities: "{{ device_entities(awtrix_id) }}"
  awtrix_topic: "{{ awtrix_entities | select('search', 'mqtt_prefix') | first }}"
  awtrix_topic_id: "{{ states(awtrix_topic) }}"

sequence:
  - action: mqtt.publish
    data:
      topic: "{{ awtrix_topic_id }}/cmd/apps/pushed/{{ app_name }}"
      payload: >-
        {% set ns = namespace(fragments=[]) %}
        {% for temperature in temperatures %}
          {% set sensor_id = temperature.get("sensor_id", "") %}
          {% set value = states(sensor_id) if sensor_id else "unknown" %}
          {% if value not in ['unknown', 'unavailable', 'none'] %}
            {% set rounding = (temperature.get("rounding") or "1") %}
            {% if rounding | string in ['0', '1', '2'] %}
              {% set precision = rounding | int %}
              {% set value = ("%." ~ precision ~ "f") | format(value | float | round(precision)) %}
            {% endif %}
            {% set unit = (state_attr(sensor_id, 'unit_of_measurement') or '') | replace('°', '') if not (temperature.get("hide_unit", false) | bool(false)) else '' %}
            {% set value = value ~ ("°" if not (temperature.get("hide_degree", false) | bool(false)) else "") ~ unit %}
            {% set label = (temperature.get("label") or "") | trim %}
            {% if label %}
              {% set value = label ~ value %}
            {% endif %}
            {% set color = temperature.get("color") or [255, 255, 255] %}
            {% set fragment = {"text": value, "color": color} %}
            {% if ns.fragments %}
              {% set ns.fragments = ns.fragments + [{"text": " "}] %}
            {% endif %}
            {% set ns.fragments = ns.fragments + [fragment] %}
          {% endif %}
        {% endfor %}
        {% if app_icon %}
          {% set output = {"text": ns.fragments, "icon": app_icon, "iconMode": "push"} %}
        {% else %}
          {% set output = {"text": ns.fragments} %}
        {% endif %}
        {{ output | to_json(sort_keys=True) }}
