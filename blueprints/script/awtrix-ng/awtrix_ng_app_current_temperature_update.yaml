blueprint:
  name: AWTRIX NG App - Current Temperature - Update
  description: >-
    Publishes the selected temperature sensor as an AWTRIX NG pushed app.
    Configure it for one AWTRIX NG device, then run it manually with a sensor
    or call it from the matching automation blueprint.
  domain: script
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/script/awtrix-ng/awtrix_ng_app_current_temperature_update.yaml
  author: phillc
  input:
    awtrix_id:
      name: AWTRIX NG Device
      selector:
        device:
          filter:
            - model: AWTRIX NG

fields:
  temperature_sensor_id:
    name: Temperature Sensor Source
    selector:
      entity:
        filter:
          - domain: sensor
            device_class: temperature
    required: true

variables:
  awtrix_id: !input awtrix_id
  awtrix_entities: "{{ device_entities(awtrix_id) }}"
  awtrix_topic: "{{ awtrix_entities | select('search', 'mqtt_prefix') | first }}"
  awtrix_topic_id: "{{ states(awtrix_topic) }}"
  temperature: "{{ states(temperature_sensor_id) }}"

sequence:
  - action: mqtt.publish
    data:
      topic: "{{ awtrix_topic_id }}/cmd/apps/pushed/current_temperature"
      payload: >-
        {% set output = {"text": temperature ~ "°F", "icon": "3357", "iconMode": "push"} %}
        {{ output | to_json(sort_keys=True) }}
