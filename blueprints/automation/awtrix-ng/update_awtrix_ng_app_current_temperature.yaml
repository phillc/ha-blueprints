blueprint:
  name: Update AWTRIX NG App Current Temperature
  description: >-
    Calls the selected AWTRIX NG Current Temperature Update script at the
    configured interval and whenever AWTRIX NG restarts. The selected script
    contains all sensor and display configuration.
  domain: automation
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/automation/awtrix-ng/update_awtrix_ng_app_current_temperature.yaml
  author: phillc

  input:
    awtrix_uptime_id:
      name: AWTRIX NG Uptime Sensor
      description: "Select the uptime sensor belonging to the device configured in the selected script. A value below 60 republishes the app after a reboot."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: duration
    script_id:
      name: AWTRIX NG Current Temperature Update Script
      description: "Select a script created from the AWTRIX NG App - Current Temperature - Update blueprint."
      selector:
        entity:
          filter:
            - domain: script
    refresh_interval:
      name: Refresh Interval
      description: "How often to republish the temperature app."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
          unit_of_measurement: minutes

trigger_variables:
  refresh_interval: !input refresh_interval

triggers:
  - trigger: time_pattern
    minutes: "/{{ refresh_interval | int }}"
  - trigger: numeric_state
    entity_id: !input awtrix_uptime_id
    below: 60

actions:
  - action: !input script_id
