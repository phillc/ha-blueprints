blueprint:
  name: Update AWTRIX NG App Current Temperature
  description: >-
    Calls the selected AWTRIX NG Current Temperature Update script whenever the
    temperature changes or AWTRIX NG restarts. The script is configured for the
    selected AWTRIX NG device; this automation supplies the temperature sensor.
  domain: automation
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/automation/awtrix-ng/update_awtrix_ng_app_current_temperature.yaml
  author: phillc
  
  input:
    awtrix_id:
      name: AWTRIX NG Device
      selector:
        device:
          filter:
            - model: AWTRIX NG
    awtrix_uptime_id:
      name: AWTRIX NG Uptime Sensor
      description: "Select the uptime sensor belonging to the AWTRIX NG device above. A value below 60 republishes the app after a reboot."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: duration
    temperature_sensor_id:
      name: Temperature Sensor
      description: "Select the temperature sensor sent to AWTRIX NG."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    script_id:
      name: AWTRIX NG Current Temperature Update Script
      description: "Select a script created from the AWTRIX NG App - Current Temperature - Update blueprint. Its device should match the AWTRIX NG device selected above."
      selector:
        entity:
          filter:
            - domain: script

triggers:
  - trigger: state
    entity_id: !input temperature_sensor_id
  - trigger: numeric_state
    entity_id: !input awtrix_uptime_id
    below: 60

actions:
  - action: !input script_id
    data:
      temperature_sensor_id: !input temperature_sensor_id
