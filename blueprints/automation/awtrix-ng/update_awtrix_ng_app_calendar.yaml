blueprint:
  name: Update AWTRIX NG App Calendar
  description: >-
    Calls the selected AWTRIX NG Calendar Event Update script whenever the
    calendar changes or AWTRIX NG restarts. The script is configured for the
    selected AWTRIX NG device; this automation supplies the calendar.
  domain: automation
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/automation/awtrix-ng/update_awtrix_ng_app_calendar.yaml
  author: phillc

  input:
    awtrix_uptime_id:
      name: AWTRIX NG Uptime Sensor
      description: "Select the uptime sensor belonging to the device configured in the selected script. A value below 60 republishes the app after a reboot."
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: duration
    calendar_id:
      name: Calendar
      description: "Select the calendar whose next event is sent to AWTRIX NG."
      selector:
        entity:
          filter:
            - domain: calendar
    script_id:
      name: AWTRIX NG Calendar Update Script
      description: "Select a script created from the AWTRIX NG App - Calendar Event - Update blueprint. Its device should match the selected uptime sensor."
      selector:
        entity:
          filter:
            - domain: script
triggers:
  - trigger: state
    entity_id: !input calendar_id
  - trigger: time
    at: 01:00:00
  - trigger: numeric_state
    entity_id: !input awtrix_uptime_id
    below: 60

actions:
  - action: !input script_id
    data:
      calendar_id: !input calendar_id
