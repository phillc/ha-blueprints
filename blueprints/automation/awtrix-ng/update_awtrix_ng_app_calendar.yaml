blueprint:
  name: Update AWTRIX NG App Calendar
  description: >-
    Calls the selected AWTRIX NG Calendar Event Update script whenever the
    calendar changes or AWTRIX NG restarts. The script is configured for the
    selected AWTRIX NG device; this automation supplies the calendar.
  domain: automation
  source_url: https://github.com/phillc/ha-blueprints/blob/main/blueprints/automation/awtrix-ng/update_awtrix_ng_app_calendar.yaml
  author: phillc

  input:
    awtrix_id:
      name: AWTRIX NG Device
      description: "Select the AWTRIX NG device. Its duration-class sensor is used to detect reboots."
      selector:
        device:
          filter:
            - model: AWTRIX NG
          entity:
            - domain: sensor
              device_class: duration
    calendar_id:
      name: Calendar
      description: "Select the calendar whose next event is sent to AWTRIX NG."
      selector:
        entity:
          filter:
            - domain: calendar
    script_id:
      name: AWTRIX NG Calendar Update Script
      description: "Select a script created from the AWTRIX NG App - Calendar Event - Update blueprint. Its device should match the selected AWTRIX NG device."
      selector:
        entity:
          filter:
            - domain: script
trigger_variables:
  awtrix_id: !input awtrix_id

triggers:
  - trigger: state
    entity_id: !input calendar_id
  - trigger: time
    at: 01:00:00
  - trigger: template
    value_template: >-
      {% set uptime = expand(device_entities(awtrix_id))
        | selectattr('attributes.device_class', 'eq', 'duration')
        | map(attribute='entity_id') | list | first %}
      {{ uptime is not none and states(uptime) | float(999) < 60 }}

actions:
  - action: !input script_id
    data:
      calendar_id: !input calendar_id
